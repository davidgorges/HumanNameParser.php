language: php
php:
  - "8.1"
  - "8.2"
  - "8.3"
  - "8.4"

install: composer install

script:
  - vendor/bin/phpunit
  - vendor/bin/phpstan analyse
  - vendor/bin/phpcs --standard=PSR12 src/ tests/

notifications:
  recipients:
    - david.gorges@leaphub.de
  on_success: change
  on_failure: always
